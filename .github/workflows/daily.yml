name: Daily Brown update

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC, after Brown's daily price update (~12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_brown.py
      - run: pip install pandas xlrd
      - run: python war_energy.py   # EIA weekly war energy tally -> data/war_energy.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && git diff --quiet || (git commit -am "Daily update: Brown + EIA war energy" && git push)
