name: Daily tracker update

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC, after Brown's daily price update (~12:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas xlrd
      - run: python war_energy.py    # EIA war energy tally -> data/war_energy.json
      - run: python tariff_cost.py   # NY Fed tariff tally, same end date -> data/tariffs.json
      - run: python update_page.py   # fill index.html from both, plus Brown and mortgage rates
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet || (git commit -m "Daily update: war energy, tariffs, Brown, mortgage" && git push)
